name: Deploy to GitHub Pages

# Publishes the current site, plus a frozen build of every released version
# under /versions/<v>/. Each archived version is built from the commit it
# shipped from (pinned in src/version.js), so it is genuinely the code and
# data of that release — nothing in the current app has to carry a
# compatibility shim for an old design, and no later refactor can break an
# archived one. An archive that fails to build is skipped; the current
# site still deploys.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # archived versions are built from their commits
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build current site
        run: |
          npm ci
          npm run build

      - name: Build archived versions
        run: |
          set -u
          mkdir -p dist/versions
          # src/version.js is the single source of truth for what exists and
          # which commit each release shipped from.
          node -e "import('./src/version.js').then(m=>console.log(JSON.stringify(m.ARCHIVED.map(r=>({v:r.v,commit:r.commit})))))" > /tmp/archived.json
          cat /tmp/archived.json

          COUNT=$(node -e "console.log(require('/tmp/archived.json').length)")
          for i in $(seq 0 $((COUNT - 1))); do
            VER=$(node -e "console.log(require('/tmp/archived.json')[$i].v)")
            REF=$(node -e "console.log(require('/tmp/archived.json')[$i].commit || '')")
            if [ -z "$REF" ]; then
              echo "== v$VER has no commit pinned — skipping"
              continue
            fi
            echo "== building v$VER from $REF into dist/versions/$VER/"
            WORK="$(mktemp -d)"
            if ! git worktree add --detach "$WORK" "$REF" >/dev/null 2>&1; then
              echo "   !! could not check out $REF — skipping"
              continue
            fi
            if (
              cd "$WORK"
              npm ci --silent
              # `npm run build --`, not `npx vite build`: the data module is
              # generated by the prebuild hook, which npx would skip — the
              # build then fails on missing imports.
              #
              # Build into the worktree's own dist/ and copy, rather than
              # passing --outDir: older releases carry a spa-fallback plugin
              # that writes 404.html to a hardcoded dist/, so redirecting the
              # output breaks them. --base is all that needs overriding.
              npm run build -- --base "/novavote/versions/$VER/"
            ); then
              mkdir -p "dist/versions/$VER"
              cp -r "$WORK/dist/." "dist/versions/$VER/"
              echo "   archived v$VER ($(du -sh "dist/versions/$VER" | cut -f1))"
            else
              echo "   !! build of v$VER failed — its archive will 404, current site unaffected"
            fi
            git worktree remove --force "$WORK" >/dev/null 2>&1 || true
          done

          echo "archived:"; ls -1 dist/versions 2>/dev/null || echo "  (none)"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
