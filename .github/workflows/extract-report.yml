name: Extract AB report PDFs

# The county publishes these reports only as PDFs, and the dev sandbox has no
# outbound access to fairfaxcounty.gov. This job fetches them from a runner
# (which does), dumps the text layer for inspection, parses each into the
# NovaVote CSV schema, and commits the result back to the branch.
#
# The parse is self-checking: every report prints its own grand-total row,
# and scripts/parse_report.py asserts every daily column against it, so a
# misparse fails the job instead of committing bad numbers.

on:
  push:
    paths:
      - 'scripts/extract_pdf.py'
      - 'scripts/parse_report.py'
      - 'scripts/find_reports.py'
      - 'scripts/fetch_boundary.py'
      - 'scripts/fetch_fonts.py'
      - 'scripts/geocode_sites.py'
      - 'scripts/fetch_weather.py'
      - 'scripts/fetch_turnout.py'
      - 'scripts/parse_dal.py'
      - 'data/site_locations.json'
      - '.github/workflows/extract-report.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pdfplumber pyshp

      - name: Fetch and self-host webfonts
        run: python scripts/fetch_fonts.py

      - name: Geocode early voting sites
        # Non-blocking: an address the geocoders can't resolve must not stop
        # the report parsing below. gen-data.mjs refuses to build a site with
        # no coordinate, so a miss still can't ship.
        #
        # `set +e` then an explicit echo: continue-on-error hides a crash
        # entirely, and a malformed entry (missing city/state/zip) once made
        # this step exit in under a second looking like a success.
        continue-on-error: true
        run: |
          python scripts/geocode_sites.py || echo "::warning::geocoder exited non-zero"

      - name: Fetch county boundary
        run: python scripts/fetch_boundary.py

      - name: Fetch daily weather
        # After the boundary fetch: the centroid is derived from it.
        continue-on-error: true
        run: python scripts/fetch_weather.py

      - name: Check registered-voter counts
        # data/registration.json is supplied and committed; this is the
        # second opinion on it, from the state's own per-election files.
        # It writes nothing — a disagreement is printed, not applied.
        continue-on-error: true
        run: python scripts/fetch_turnout.py

      - name: Discover published reports
        continue-on-error: true
        run: python scripts/find_reports.py

      - name: Download and dump text layer
        run: python scripts/extract_pdf.py

      - name: Parse final reports (xlsx)
        run: |
          pip install --quiet openpyxl
          python scripts/parse_xlsx_report.py --all

      - name: Parse into CSVs
        run: |
          # NOTE: no 2023 here. The county's *final* 2023 report is an
          # xlsx parsed above; the PDF this repo started from is a
          # mid-cycle snapshot ending 23 Oct. Re-parsing it into
          # fairfax-2023-general would overwrite the final data with the
          # snapshot on every run.
          # nov2024.pdf is now the *end-of-cycle* report ("- 11.07"),
          # not the "- 9.24" snapshot this project started from. The
          # snapshot is still downloaded for reference as
          # nov2024_snapshot.pdf and is deliberately not parsed — doing
          # so would overwrite the final data with five days of it.
          python scripts/parse_report.py pdf-extract/nov2024.pdf \
            --year 2024 --cycle fairfax-2024-general
          # 2025 is the control: we already have hand-validated CSVs for it,
          # so a parser that reconciles here is trustworthy on the others.
          python scripts/parse_report.py pdf-extract/nov2025.pdf \
            --year 2025 --cycle fairfax-2025-general

      - name: Keep a local copy of each source PDF
        # Held in the repo under data/sources/ rather than public/, so it is
        # a reference copy we control and not something the built site
        # serves. Publishers move and delete these files; once a report is
        # gone from the county's server, this is the only copy of what the
        # committed CSVs were parsed from.
        run: |
          mkdir -p data/sources
          cp -f pdf-extract/*.pdf data/sources/ 2>/dev/null || true
          ls -la data/sources/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pdf-extract
          path: |
            pdf-extract/
            data/parsed/

      - name: Commit generated data
        run: |
          set -u
          BRANCH="${{ github.ref_name }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Listed one at a time and skipped when absent: `git add` on a
          # path that does not exist aborts the whole command and stages
          # nothing, so one step that failed to produce its output would
          # silently throw away every other step's.
          for p in data/sources data/parsed \
                   data/site_locations.json data/weather.json \
                   src/data/fairfax-boundary.json src/fonts src/styles/fonts.css; do
            [ -e "$p" ] && git add "$p" || echo "no $p to add"
          done
          if git diff --staged --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          # No "[skip ci]" here. GitHub concatenates a branch's commit messages
          # into the body of a squash merge, so that marker would ride along
          # onto main and silently suppress the deploy for that push — which
          # is exactly what happened once. Keep this workflow from retriggering
          # itself via its `paths:` filter instead, which it already does.
          git commit -m "Refresh generated assets: report CSVs, geocodes, boundary, fonts"

          # This job takes ~30s, which is long enough for a human push to land
          # on the same branch first. Without this the push is rejected as
          # non-fast-forward and the generated data is silently thrown away —
          # which is exactly what happened twice before this loop existed.
          for attempt in 1 2 3; do
            if git push origin HEAD:"$BRANCH"; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected; rebasing onto origin/$BRANCH and retrying"
            git fetch origin "$BRANCH"
            git rebase "origin/$BRANCH" || { git rebase --abort; echo "rebase failed"; exit 1; }
            sleep $((attempt * 3))
          done
          echo "could not push after 3 attempts"
          exit 1
