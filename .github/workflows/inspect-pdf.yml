name: Inspect a report PDF

# Ad-hoc tool: dump a specific report's pages so their layout can be read
# without running the whole extract/parse pipeline. The dev sandbox can't
# reach fairfaxcounty.gov, so this is the way to look at a page.

on:
  workflow_dispatch:
    inputs:
      report:
        description: 'Report key (nov2025, nov2024, nov2023)'
        required: true
        default: 'nov2025'
      pages:
        description: "Pages, e.g. '1' or '1-3'"
        required: false
        default: '1'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pdfplumber
      - run: |
          python scripts/extract_pdf.py "${{ github.event.inputs.report }}" \
            --pages "${{ github.event.inputs.pages }}"
