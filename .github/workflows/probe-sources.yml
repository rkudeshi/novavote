name: Probe NoVA data sources

# Reconnaissance only. The dev sandbox has no outbound access to
# elections.virginia.gov or vpap.org; this runs on a runner that does and
# dumps what each candidate URL returns, so the response shape can be read
# before any parser is written against it. It commits nothing.

on:
  push:
    paths:
      - 'scripts/probe_nova_sources.py'
      - 'scripts/probe_registration.py'
      - 'scripts/fetch_turnout.py'
      - '.github/workflows/probe-sources.yml'
  workflow_dispatch:
    inputs:
      urls:
        description: 'Space-separated URLs to probe (blank = built-in list)'
        required: false
        default: ''

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe
        run: python scripts/probe_nova_sources.py --schedule ${{ github.event.inputs.urls }}
      - name: Probe registration statistics
        # Separate from the list above because it is after one specific
        # thing: a per-locality registered-voter count, which is the
        # denominator eight of nine jurisdictions are missing.
        continue-on-error: true
        run: python scripts/probe_registration.py
      - name: Dump the state's turnout files
        # Dump only. Once the column shapes are confirmed this moves to
        # extract-report.yml with --write, which is the job that commits.
        #
        # Kept last on purpose: the steps above emit hundreds of harvested
        # links, and reading this one's output means reading the tail.
        continue-on-error: true
        run: python scripts/fetch_turnout.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-out
          path: probe-out/
          if-no-files-found: ignore
